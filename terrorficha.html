<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ordem Paranormal</title>
  </head>
  <body>
    <header>
      <div>
        <img
          src="https://i.pinimg.com/736x/2e/36/fd/2e36fd1196b8d819f329458a4f6ae55f.jpg"
          alt="ordemparanormal"
        />
      </div>
    </header>

    <div>
      <h1>Ficha</h1>
    </div>
    <!-- Preenchimento nome e idade -->
    <div>
      <ul>
        <li>
          <label for="nome">JOGADOR(A):</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome aqui"
          />
        </li>
        <li>
          <label for="idade">IDADE:</label>
          <input
            type="text"
            id="idade"
            name="idade"
            placeholder="Digite sua idade aqui"
          />
        </li>
      </ul>
    </div>

    <!-- Preenchimento geral -->
    <div>
      <ul>
        <li>
          <label for="classe">CLASSE:</label>
          <select id="classe" name="classe">
            <option value="ocultista">Ocultista</option>
            <option value="combatente">Combatente</option>
            <option value="especialista">Especialista</option>
          </select>
        </li>
        <li>
          <label for="patente">PATENTE:</label>
          <select id="patente" name="patente">
            <option value="recruta">Recruta</option>
            <option value="operador">Operador</option>
            <option value="agenteespecial">Agente Especial</option>
            <option value="oficialdeoperações">Oficial de Operações</option>
            <option value="agentedeelite">Agente de Elite</option>
          </select>
        </li>
        <li>
          <label for="elemento">ELEMENTO:</label>
          <select id="elemento" name="elemento">
            <option value="sangue">Sangue</option>
            <option value="morte">Morte</option>
            <option value="conhecimento">Conhecimento</option>
            <option value="Energia">Energia</option>
          </select>
        </li>

        <li>
          <label for="trilha">TRILHA:</label>
          <input
            type="text"
            id="trilha"
            name="trilha"
            placeholder="Descreva a sua trilha"
          />
        </li>
 <li>
        <label for="origem">ORIGEM:</label>
<select id="origem" name="origem">
  <option value="academico">Acadêmico</option>
  <option value="agente_de_saude">Agente de Saúde</option>
  <option value="amnesico">Amnésico</option>
  <option value="artista">Artista</option>
  <option value="atleta">Atleta</option>
  <option value="chef">Chef</option>
  <option value="criminoso">Criminoso</option>
  <option value="cultista_arrependido">Cultista Arrependido</option>
  <option value="desgarrado">Desgarrado</option>
  <option value="engenheiro">Engenheiro</option>
  <option value="executivo">Executivo</option>
  <option value="investigador">Investigador</option>
  <option value="lutador">Lutador</option>
  <option value="mercenario">Mercenário</option>
  <option value="militar">Militar</option>
  <option value="operario">Operário</option>
  <option value="policial">Policial</option>
  <option value="religioso">Religioso</option>
  <option value="servidor_publico">Servidor Público</option>
  <option value="teorico_da_conspiracao">Teórico da Conspiração</option>
  <option value="ti">T.I.</option>
  <option value="vitima">Vítima</option>
</select>
      </li>

      <li>
         <label for="pex">PEX</label>
          <input
            type="text"
            id="pex"
            name="pex"
            placeholder="xxxxx/xxxxx"
          />
      </li>
      <li>
         <label for="nex">NEX:</label>
          <input
            type="text"
            id="nex"
            name="nex"
            placeholder="X %"
          />
      </li>
      <li>
       <label for="pemax">PE MAX:</label>
          <input
            type="text"
            id="pemax"
            name="pemax"
            placeholder="XX"
          />
      </li>
<li>
  <label for="prestigio">PRESTIGIO:</label>
          <input
            type="text"
            id="pemax"
            name="pemax"
            placeholder="XX"
          />
</li>
      </ul>
    </div>

    <footer>
      <p>IFRN - CAMPUS MACAU</p>
    </footer>
  </body>
</html>
