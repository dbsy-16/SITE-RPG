<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeons and Dragons</title>
  </head>
  <body>
    <header>
      <div>
        <img
          src="https://i.pinimg.com/1200x/10/e0/90/10e0907e785cf3892726cb2a0e55cb10.jpg"
          alt="dungeonsanddragons"
        />
        <h1>Dungeons & Dragons</h1>
      </div>
    </header>

    <h2>Ficha</h2>

    <div>
      <h2>Informações do Jogador</h2>

      <label for="nome">Nome do Jogador:</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome aqui"
          />

      <br /><br />

      <label for="nomep">Nome do Personagem:</label>
          <input
            type="text"
            id="nomep"
            name="nomep"
            placeholder="Digite o nome aqui"
          />
    </div>

    <div>
      <h2>Escolha seu personagem</h2>

      <label>Raça:</label>

      <select>
        <option>Humano</option>
        <option>Elfo</option>
        <option>Anão</option>
        <option>Halfling</option>
        <option>Tiefling</option>
      </select>
    </div>

    <br /><br />

    <div>
      <label>Classe:</label>

      <select>
        <option>Guerreiro</option>
        <option>Mago</option>
        <option>Arqueiro</option>
        <option>Ladino</option>
        <option>Clérigo</option>
        <option>Bárbaro</option>
      </select>
    </div>

    <div>
      <h2>Atributos</h2>

      <label>Força:</label>
      <input type="number" />

      <br /><br />

      <label>Destreza:</label>
      <input type="number" />

      <br /><br />

      <label>Constituição:</label>
      <input type="number" />

      <br /><br />

      <label>Inteligência:</label>
      <input type="number" />

      <br /><br />

      <label>Sabedoria:</label>
      <input type="number" />

      <br /><br />

      <label>Carisma:</label>
      <input type="number" />
    </div>

    <div>
      <h2>Histórico do Personagem</h2>

      <label>Conte sobre seu personagem:</label>

      <br /><br />

      <textarea rows="5" cols="40"></textarea>
    </div>

    <div>
      <h2>Equipamentos</h2>

      <p>Escolha seus equipamentos:</p>

      <input type="checkbox" />
      <label>Espada</label>

      <br />

      <input type="checkbox" />
      <label>Arco</label>

      <br />

      <input type="checkbox" />
      <label>Cajado</label>

      <br />

      <input type="checkbox" />
      <label>Adaga</label>
    </div>

    <div>
      <h2>Ficha do Personagem</h2>

      <label>Pontos de Vida:</label>
      <input type="number" />

      <br /><br />

      <label>Nível:</label>
      <input type="number" />
    </div>

    <br /><br />

    <div>
      <button onclick="alert('Ficha finalizada!')">Começar Aventura</button>
    </div>

    <footer>
      <p>IFRN - CAMPUS MACAU - Página feita por Sammily</p>
    </footer>
  </body>
</html>
