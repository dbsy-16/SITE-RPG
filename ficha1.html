<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeons and Dragons</title>
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <div id="carregamento">
      <div id="emote">🎲</div>
      <p>Preparando a aventura…</p>
    </div>

    <header>
      <div>
        <img
          src="https://i.pinimg.com/1200x/10/e0/90/10e0907e785cf3892726cb2a0e55cb10.jpg"
          alt="dungeonsanddragons"
        />
        <h1>Dungeons & Dragons</h1>
        <br />
        <label for="tema">Tema:</label>
        <select id="tema">
          <option value="dia">Dia</option>
          <option value="noite">Noite</option>
        </select>
      </div>
    </header>

    <h2>Ficha</h2>

    <div class="linha">
      <h2>Informações do Jogador</h2>

      <div class="campo">
        <label for="nome">Nome do Jogador:</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Digite seu nome aqui"
        />
      </div>

      <div class="campo">
        <label for="nomep">Nome do Personagem:</label>
        <input
          type="text"
          id="nomep"
          name="nomep"
          placeholder="Digite o nome aqui"
        />
      </div>
    </div>

    <div class="linha">
      <h2>Escolha seu personagem</h2>

      <div class="campo">
        <label>Raça:</label>
        <select>
          <option>Humano</option>
          <option>Elfo</option>
          <option>Anão</option>
          <option>Halfling</option>
          <option>Tiefling</option>
        </select>
      </div>

      <div class="campo">
        <label>Classe:</label>
        <select>
          <option>Guerreiro</option>
          <option>Mago</option>
          <option>Arqueiro</option>
          <option>Ladino</option>
          <option>Clérigo</option>
          <option>Bárbaro</option>
        </select>
      </div>
    </div>

    <div class="grid-atributos">
      <h2>Atributos</h2>

      <div class="campo">
        <label>Força:</label>
        <input type="number" />
      </div>

      <div class="campo">
        <label>Destreza:</label>
        <input type="number" />
      </div>

      <div class="campo">
        <label>Constituição:</label>
        <input type="number" />
      </div>

      <div class="campo">
        <label>Inteligência:</label>
        <input type="number" />
      </div>

      <div class="campo">
        <label>Sabedoria:</label>
        <input type="number" />
      </div>

      <div class="campo">
        <label>Carisma:</label>
        <input type="number" />
      </div>
    </div>

    <div>
      <h2>Histórico do Personagem</h2>

      <label>Conte sobre seu personagem:</label>
      <textarea rows="5" cols="40"></textarea>
    </div>

    <div class="equipamentos">
      <h2>Equipamentos</h2>

      <p>Escolha seus equipamentos:</p>

      <label><input type="checkbox" /> Espada</label>
      <label><input type="checkbox" /> Arco</label>
      <label><input type="checkbox" /> Cajado</label>
      <label><input type="checkbox" /> Adaga</label>
    </div>

    <div class="linha">
      <h2>Ficha do Personagem</h2>

      <div class="campo">
        <label>Pontos de Vida:</label>
        <input type="number" />
      </div>

      <div class="campo">
        <label>Nível:</label>
        <input type="number" />
      </div>
    </div>

    <div>
      <h2>Rolador de Dados</h2>
      <button id="rolar">Rolar d20</button>
      <p id="resultado"></p>
    </div>

    <div class="acoes">
      <button onclick="alert('Ficha finalizada!')">Começar Aventura</button>
      <a href="texto1.html">
        <button>Acessar Informações sobre o RPG</button>
      </a>
    </div>

    <footer>
      <p>IFRN - CAMPUS MACAU - Página feita por Sammily</p>
      <p>Ficha Versão 1.0</p>
    </footer>

    <script src="ficha1.js"></script>
  </body>
</html>
