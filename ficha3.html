<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ficha - Lésbicas Espadachins Sedentas</title>

    <link rel="stylesheet" href="style3.css">
</head>

<body>

    <main class="ficha">

        <header>
            <h1>⚔ ROMANCE ⚔</h1>
            <h2>Lésbicas Espadachins Sedentas</h2>
        </header>


        <!-- DADOS DA PERSONAGEM -->

        <section class="dados">

            <div>
                <label>Nome</label>
                <input type="text">
            </div>

            <div>
                <label>Pronomes</label>
                <input type="text">
            </div>

            <div>
                <label>Especialidade</label>
                <input type="text">
            </div>

        </section>


        <!-- ATRIBUTOS -->

        <section>

            <h3>Atributos</h3>

            <div class="atributos">

                <label>
                    Ligeiro
                    <input type="number" min="0">
                </label>

                <label>
                    Poderoso
                    <input type="number" min="0">
                </label>

                <label>
                    Preciso
                    <input type="number" min="0">
                </label>

                <label>
                    Sagaz
                    <input type="number" min="0">
                </label>

            </div>

        </section>


        <!-- HABILIDADES -->

        <section>

            <h3>Habilidades</h3>

            <div class="habilidades">

                <label>
                    <input type="checkbox">
                    Agarrar
                </label>

                <label>
                    <input type="checkbox">
                    Atravessar
                </label>

                <label>
                    <input type="checkbox">
                    Buscar
                </label>

                <label>
                    <input type="checkbox">
                    Curar
                </label>

                <label>
                    <input type="checkbox">
                    Golpear
                </label>

                <label>
                    <input type="checkbox">
                    Estudar
                </label>

            </div>

        </section>


        <!-- ARMA -->

        <section>

            <h3>Arma / Técnica</h3>

            <input
                class="campo-grande"
                type="text"
                placeholder="Nome da arma ou técnica">

            <textarea
                placeholder="Descrição breve"></textarea>

        </section>


        <!-- TRAÇOS -->

        <section>

            <h3>Traços</h3>

            <textarea
                placeholder="Personalidade, características ou detalhes importantes...">
            </textarea>

        </section>


        <!-- VIGOR -->

        <section>

            <h3>Vigor</h3>

            <div class="vigor">

                <label>
                    Atual
                    <input type="number" min="0">
                </label>

                <label>
                    Máximo
                    <input type="number" min="0">
                </label>

            </div>

        </section>


        <!-- CONDIÇÕES -->

        <section>

            <h3>Condições</h3>

            <textarea
                placeholder="Condições ou efeitos atuais...">
            </textarea>

        </section>

        <div class="botaoles">
      <a href="texto3.html">
            <button id="botaole">Acessar Informações sobre o RPG</button>
                </a>
    </div>

        <footer>
            <p>IFRN - Campus Macau- página feita por Hemilly</p>
            <p>Ficha Versão 3.0</p>
        </footer>

    </main>

</body>
</html>
